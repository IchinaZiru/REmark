id: F037
function: SearchReservationByID
range:
- 707
- 718
args:
- ReservationPtr ReservationList
- int ID
return: ReservationPtr
requirement:
  trigger: "予約IDに基づいて特定の予約情報を検索したいとき"
  action: "予約リストを先頭から順に走査し、指定されたIDに一致する予約構造体を探す"
  effect: "該当する予約が見つかった場合はそのポインタを返し、見つからない場合はNULLを返す"
  constraint: "線形探索を用いる。予約リストは単方向リスト構造で、IDは一意であることを前提とする"
