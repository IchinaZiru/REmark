id: F013
function: SearchUserByFirstName
range:
- 215
- 227
args:
- UserPtr UserList
- char FirstName[MAX_STRING_SIZE]
- bool *IsExist
return: void
requirement:
  trigger: "ユーザー一覧から、指定した名（First Name）で一致するユーザーを検索したいとき"
  action: "線形リストを先頭から走査し、名が一致するユーザーが見つかればその情報を表示し、フラグを true に設定する"
  effect: "指定された名前に一致するユーザーの情報が表示され、検索結果の有無が呼び出し元で判定できる"
  constraint: "一致するユーザーが複数いても全件表示され、部分一致には対応していない"
