id: F048
function: ReservationManagementMenu
range:
- 939
- 977
args:
- ReservationPtr *ReservationList
- UserPtr UserList
- RoomPtr *RoomList
return: void
requirement:
  trigger: "ユーザーがメインメニューから予約管理画面を選択したとき"
  action: |
    ・画面を初期化し、予約管理用メニューを表示  
    ・ユーザーの入力（1〜5）に応じて対応する処理を実行  
      - 1: 新規予約追加（AddNewReservationScreen）  
      - 2: 予約削除（DeleteReservationScreen）  
      - 3: 予約一覧表示（DisplayReservationsScreen）  
      - 4: 日付順にソート（SortReservationsByDateScreen）  
      - 5: メインメニューに戻る  
    ・無効な入力には「Error!」と表示
  effect: "ユーザーが予約情報の操作（追加・削除・表示・ソート）を選択して実行できる"
  constraint: |
    ・選択肢は 1〜5 に限定  
    ・すべての処理後には再度メニューが表示される（5を選ぶまでループ）  
    ・引数には予約・ユーザー・部屋の情報が渡されている必要がある
