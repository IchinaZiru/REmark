id: F046
function: SortReservationsByDate
range:
- 902
- 921
args:
- ReservationPtr ReservationList
return: ReservationPtr
requirement:
  trigger: "予約情報を日付順に並べたいとき（例：表示前にソートする処理）"
  action: |
    ・予約リスト（単方向リスト）の各ノードに対してバブルソート的に走査を行う  
    ・2つの予約の日時を比較して、必要に応じて `SwapReservationData` を用いて入れ替える  
    ・比較には `IsDate1BeforeDate2` を使う
  effect: "ReservationListが日付の昇順に並び替えられる"
  constraint: |
    ・破壊的ソート（元のリスト構造のノード順序は変わる）  
    ・ソート対象は `Date` フィールドのみ（時刻までは考慮しない）  
    ・同一日付の順序は保証しない（安定ソートではない）