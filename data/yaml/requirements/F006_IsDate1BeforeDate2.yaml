id: F006
function: IsDate1BeforeDate2
range:
- 102
- 117
args:
- stDate Date1
- stDate Date2
return: bool
requirement:
  trigger: "2つの日付の前後関係を比較したいとき"
  action: "年・月・日の順に、Date1 が Date2 より前かどうかを比較する"
  effect: "Date1 が Date2 より前なら true、そうでなければ false を返す"
  constraint: "日付の正当性（存在する日付かどうか）は前提として与えられている必要がある"
