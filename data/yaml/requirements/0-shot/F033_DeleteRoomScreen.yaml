id: F033
function: DeleteRoomScreen
range:
  - 597
  - 620
args:
  - RoomPtr *RoomList
return: void
requirement:
  trigger: ''
  action: ''
  effect: ''
  constraint: ''
code: "void DeleteRoomScreen(RoomPtr *RoomList)\n{\n  ScreenHeader(\"\\tDelete Room\"\
  );\n  int ID;\n  printf(\"\\nPlease enter ID: \");\n  ID = ReadIntBetween(0, 9999);\n\
  \  RoomPtr Room = SearchRoomByID(*RoomList, ID);\n  if (Room != NULL)\n  {\n   \
  \ DisplayRoomCard(Room);\n    char Choice = 'n';\n    printf(\"\\n\\ nAre you sure
  you want to delete this room? y/n? \");\n    scanf(\" %c\", &Choice);\n    if (Choice
  == 'y')\n    {\n      *RoomList = DeleteRoomByID(*RoomList, ID);\n      printf(\"\
  \\nRoom with ID [%d] deleted successfully!\\n\", ID);\n    }\n  }\n  else\n    printf(\"\
  \\nRoom with ID [%d] not found!\\n\", ID);\n\n  PauseProgram();\n}\n"
description: 
  この関数は、ユーザーに部屋のIDを入力させ、そのIDに対応する部屋が存在する場合は削除するかどうかを確認し、ユーザーが削除を選択した場合にその部屋を削除する機能を提供します。部屋が見つからない場合や削除が完了した場合には、それぞれ適切なメッセージを表示します。
