id: F032
function: DisplayRoomListScreen
range:
  - 575
  - 595
args:
  - RoomPtr RoomList
return: void
requirement:
  trigger: ''
  action: ''
  effect: ''
  constraint: ''
code: "void DisplayRoomListScreen(RoomPtr RoomList)\n{\n  ScreenHeader(\"\\t Room
  List\");\n\n  if (RoomList == NULL)\n  {\n    printf(\"\\nList is empty!\");\n \
  \ }\n  else\n  {\n    RoomPtr current = RoomList;\n    int i = 0;\n    while (current
  != NULL)\n    {\n      printf(\"\\n - Room [%d]:\", ++i);\n      DisplayRoomCard(current);\n\
  \      current = current->Next;\n    }\n  }\n  PauseProgram();\n}\n"
description: 
  この関数は、与えられた部屋のリストを画面に表示し、リストが空の場合はその旨を通知します。リスト内の各部屋については、詳細情報を個別に表示し、処理の最後にプログラムを一時停止します。
