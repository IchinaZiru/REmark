id: F027
function: SearchRoomByName
range:
  - 488
  - 500
args:
  - RoomPtr RoomList
  - char Name[MAX_STRING_SIZE]
  - bool *IsExist
return: void
requirement:
  trigger: ''
  action: ''
  effect: ''
  constraint: ''
code: "void SearchRoomByName(RoomPtr RoomList, char Name[MAX_STRING_SIZE], bool *IsExist)\n\
  {\n  RoomPtr current = RoomList;\n  while (current != NULL)\n  {\n    if (strcmp(current->Name,
  Name) == 0)\n    {\n      DisplayRoomCard(current);\n      *IsExist = true;\n  \
  \  }\n    current = current->Next;\n  }\n}\n"
description: 指定された名前を持つ部屋がリスト内に存在するかを検索し、見つかった場合はその部屋の情報を表示し、存在フラグを更新します。
