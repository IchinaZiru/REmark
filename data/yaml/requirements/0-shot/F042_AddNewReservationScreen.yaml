id: F042
function: AddNewReservationScreen
range:
  - 806
  - 817
args:
  - ReservationPtr *ReservationList
  - UserPtr UserList
  - RoomPtr *RoomList
return: void
requirement:
  trigger: ''
  action: ''
  effect: ''
  constraint: ''
code: "void AddNewReservationScreen(ReservationPtr *ReservationList, UserPtr UserList,
  RoomPtr *RoomList)\n{\n  ScreenHeader(\"\\tAdd New Reservation\");\n\n  ReservationPtr
  NewReservation = (Reservation *)malloc(sizeof(Reservation));\n  ReadReservationInfo(*ReservationList,
  &NewReservation, UserList, RoomList);\n\n  *ReservationList = AddNewReservation(*ReservationList,
  NewReservation);\n  printf(\"\\nReservation Added Successfully!\\n\");\n\n  PauseProgram();\n\
  }\n"
description: 
  この関数は、新しい予約情報を入力し、予約リストに追加する機能を提供します。ユーザーと部屋の情報を参照しながら新規予約を作成し、成功メッセージを表示した後、プログラムを一時停止します。
