id: F038
function: DeleteReservationByID
range:
  - 720
  - 738
args:
  - ReservationPtr ReservationList
  - int ID
return: ReservationPtr
requirement:
  trigger: ''
  action: ''
  effect: ''
  constraint: ''
code: "ReservationPtr DeleteReservationByID(ReservationPtr ReservationList, int ID)\n\
  {\n  ReservationPtr current = ReservationList;\n  ReservationPtr previous = NULL;\n\
  \n  while (current != NULL && current->ID != ID)\n  {\n    previous = current;\n\
  \    current = current->Next;\n  }\n\n  if (previous == NULL)\n    ReservationList
  = current->Next;\n  else\n    previous->Next = current->Next;\n\n  free(current);\n\
  \  return ReservationList;\n}\n"
description: 
  この関数は、予約リストから指定されたIDの予約を削除し、更新された予約リストを返します。リストの先頭から順にIDを検索し、該当する予約を見つけた場合はそのメモリを解放してリストを再構築します。
