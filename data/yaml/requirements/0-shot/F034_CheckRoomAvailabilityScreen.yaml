function: CheckRoomAvailabilityScreen
range:
  - 622
  - 641
args:
  - RoomPtr RoomList
return: void
requirement:
  trigger: ''
  action: ''
  effect: ''
  constraint: ''
code: "void CheckRoomAvailabilityScreen(RoomPtr RoomList)\n{\n  ScreenHeader(\"  Check
  Room Availability\");\n\n  int Choice = 0;\n  printf(\"\\nChoose how you want to
  check:\\n[1] Name.\\t[2] ID.\\n\\n => \");\n  Choice = ReadIntBetween(1, 2);\n \
  \ switch (Choice)\n  {\n  case 1:\n    SearchRoomByNameScreen(RoomList);\n    break;\n\
  \  case 2:\n    SearchRoomByIDScreen(RoomList);\n\n  default:\n    printf(\"\\nInvalid
  Choice!\");\n    break;\n  }\n}\n"
description: この関数は、部屋の空き状況を名前またはIDで検索するための画面を表示し、ユーザーの選択に応じて適切な検索処理を呼び出します。
