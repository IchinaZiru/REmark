id: F007
function: IsTime1BeforeTime2
range:
  - 119
  - 129
args:
  - stTime Time1
  - stTime Time2
return: bool
requirement:
  trigger: ''
  action: ''
  effect: ''
  constraint: ''
code: "bool IsTime1BeforeTime2(stTime Time1, stTime Time2)\n{\n  if (Time1.Hour <
  Time2.Hour)\n    return true;\n  else if (Time1.Hour == Time2.Hour)\n  {\n    if
  (Time1.Minute < Time2.Minute)\n      return true;\n  }\n  return false;\n}\n"
description: この関数は、2つの時間構造体を比較し、最初の時間が2番目の時間よりも前であるかどうかを判定します。
