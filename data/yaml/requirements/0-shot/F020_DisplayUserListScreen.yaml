id: F020
function: DisplayUserListScreen
range:
  - 332
  - 352
args:
  - UserPtr UserList
return: void
requirement:
  trigger: ''
  action: ''
  effect: ''
  constraint: ''
code: "void DisplayUserListScreen(UserPtr UserList)\n{\n  ScreenHeader(\"\\tUser List\"\
  );\n\n  if (UserList == NULL)\n  {\n    printf(\"\\nList is empty!\");\n  }\n  else\n\
  \  {\n    UserPtr current = UserList;\n    int i = 0;\n    while (current != NULL)\n\
  \    {\n      printf(\"\\n - User [%d]:\", ++i);\n      DisplayUserCard(current);\n\
  \      current = current->Next;\n    }\n  }\n  PauseProgram();\n}\n"
description: 
  この関数は、ユーザーのリストを画面に表示し、リストが空の場合はその旨を通知します。リスト内の各ユーザーについては、個別のユーザーカードを表示し、処理の最後にプログラムを一時停止します。
