id: F041
function: AddNewReservation
range:
  - 790
  - 804
args:
  - ReservationPtr ReservationList
  - ReservationPtr NewReservation
return: ReservationPtr
requirement:
  trigger: ''
  action: ''
  effect: ''
  constraint: ''
code: "ReservationPtr AddNewReservation(ReservationPtr ReservationList, ReservationPtr
  NewReservation)\n{\n  if (ReservationList == NULL)\n  {\n    return NewReservation;\n\
  \  }\n\n  ReservationPtr current = ReservationList;\n  while (current->Next != NULL)\n\
  \  {\n    current = current->Next;\n  }\n  current->Next = NewReservation;\n  return
  ReservationList;\n}\n"
description: 
  この関数は、新しい予約を既存の予約リストの末尾に追加し、更新された予約リストを返します。リストが空の場合は、新しい予約をそのまま返します。
