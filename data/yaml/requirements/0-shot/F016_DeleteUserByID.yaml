id: F016
function: DeleteUserByID
range:
  - 258
  - 276
args:
  - UserPtr UserList
  - int ID
return: UserPtr
requirement:
  trigger: ''
  action: ''
  effect: ''
  constraint: ''
code: "UserPtr DeleteUserByID(UserPtr UserList, int ID)\n{\n  UserPtr current = UserList;\n\
  \  UserPtr previous = NULL;\n\n  while (current != NULL && current->ID != ID)\n\
  \  {\n    previous = current;\n    current = current->Next;\n  }\n\n  if (previous
  == NULL)\n    UserList = current->Next;\n  else\n    previous->Next = current->Next;\n\
  \n  free(current);\n  return UserList;\n}\n"
description: 指定されたIDを持つユーザーをリンクリストから削除し、更新されたリストを返す関数です。
