id: F027
function: SearchRoomByName
range:
- 488
- 500
args:
- RoomPtr RoomList
- char Name[MAX_STRING_SIZE]
- bool *IsExist
return: void
requirement:
  trigger: "部屋名で一致する部屋を検索したいとき"
  action: "全ての部屋リストを走査し、名前が一致する部屋を表示してフラグを立てる"
  effect: "指定名に一致する部屋が存在するかどうかをユーザーに通知できる"
  constraint: "一致する複数の部屋があればすべて表示され、フラグは一度でも一致すればtrueになる"
