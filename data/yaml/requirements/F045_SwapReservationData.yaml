id: F045
function: SwapReservationData
range:
- 875
- 900
args:
- ReservationPtr Reservation1
- ReservationPtr Reservation2
return: void
requirement:
  trigger: "2つの予約情報の内容を入れ替える必要があるとき（例：並び替え処理中）"
  action: |
    ・2つのReservation構造体のすべてのフィールド（ID, UserID, RoomID, Date, Start_Time, End_Time）を相互に入れ替える  
    ・一時変数を使って内容の一方が上書きされないように保持しながら交換する
  effect: "Reservation1とReservation2の情報が完全に入れ替わる"
  constraint: |
    ・Nextポインタは対象外  
    ・構造体ごとではなくフィールド単位で個別に入れ替える必要がある
