id: F015
function: AddNewUser
range:
- 242
- 256
args:
- UserPtr UserList
- UserPtr NewUser
return: UserPtr
requirement:
  trigger: "ユーザーリストに新しいユーザーを末尾に追加したいとき"
  action: "リストが空ならそのまま新規ノードを返し、空でない場合は末尾に新しいユーザーを連結する"
  effect: "ユーザーリストが新しいユーザーを含んだ状態に更新される"
  constraint: "NewUser の構造体は事前に初期化・確保されている必要がある"
