id: F041
function: AddNewReservation
range:
- 790
- 804
args:
- ReservationPtr ReservationList
- ReservationPtr NewReservation
return: ReservationPtr
requirement:
  trigger: "新たに予約情報を予約リストに追加したいとき"
  action: |
    予約リストの末尾に新たな予約構造体（NewReservation）を連結し、
    リストの先頭ポインタ（ReservationList）を返す。
  effect: "予約リストが更新され、新しい予約が末尾に追加される"
  constraint: |
    ・リストが空の場合は、新しい予約を先頭として返す  
    ・NewReservation の Next は NULL に設定されていることを前提とする
