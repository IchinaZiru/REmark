id: F047
function: SortReservationsByDateScreen
range:
- 923
- 937
args:
- ReservationPtr *ReservationList
return: void
requirement:
  trigger: "ユーザーが予約情報を日付順に並べたいとき、画面メニューからソート操作を選択"
  action: |
    ・画面ヘッダーに「Sort Reservations By Date」と表示  
    ・予約リストが空かどうかを判定し、空であれば「List is empty!」と表示  
    ・空でなければ `SortReservationsByDate` を呼び出してソート実行  
    ・ソート後に「Reservations Sorted Successfully!」と表示し、ポーズ画面へ
  effect: "ユーザーの操作によって、予約リストが日付順に並べ替えられる"
  constraint: |
    ・画面表示は常に行われる  
    ・ポインタで渡された ReservationList に対して破壊的にソートが適用される
