id: F044
function: DisplayReservationsScreen
range:
- 853
- 873
args:
- ReservationPtr ReservationList
return: void
requirement:
  trigger: "ユーザーがすべての予約情報を一覧表示したいとき"
  action: |
    ・画面に「Reservations List」の見出しを表示  
    ・予約リストが空かを判定し、空ならその旨を出力  
    ・そうでなければ、すべての予約について順に予約情報を出力（DisplayReservationCardを使用）  
    ・表示後にEnter入力で復帰
  effect: "すべての予約情報が端末画面に表示され、確認できる"
  constraint: "予約リストがNULL（空）の場合は明示的にその旨を出力する"
