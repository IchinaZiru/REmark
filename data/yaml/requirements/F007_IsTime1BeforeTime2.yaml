id: F007
function: IsTime1BeforeTime2
range:
- 119
- 129
args:
- stTime Time1
- stTime Time2
return: bool
requirement:
  trigger: "2つの時刻の前後関係を比較したいとき"
  action: "時・分の順に、Time1 が Time2 より前かどうかを比較する"
  effect: "Time1 が Time2 より前なら true、そうでなければ false を返す"
  constraint: "時刻が有効な値として与えられている前提で処理される（例：24時60分などの検証は行わない）"
