id: F018
function: SearchUserByFirstNameScreen
range:
- 298
- 313
args:
- UserPtr UserList
return: void
requirement:
  trigger: "ユーザーの名（First Name）による検索画面を表示したとき"
  action: "ユーザーに名を入力させ、その名に一致するユーザー情報を検索・表示する"
  effect: "該当ユーザーがいれば情報が表示され、いなければ『User not Found』が表示される"
  constraint: "完全一致で検索され、部分一致や大文字小文字の違いには対応していない"
