id: F043
function: DeleteReservationScreen
range:
- 819
- 851
args:
- ReservationPtr *ReservationList
- RoomPtr *RoomList
return: void
requirement:
  trigger: "ユーザーが予約情報の削除操作を選択したとき"
  action: |
    ・画面に「Delete Reservation」のヘッダーを表示  
    ・予約IDを入力させて、該当予約を検索  
    ・該当予約が存在すれば、内容を表示して削除確認  
    ・確認が 'y' なら予約リストから削除し、対応する部屋情報もリセット  
    ・結果メッセージを表示し、Enter待ちでメニュー復帰
  effect: "予約が取り消され、関連する部屋の予約状態も解除される"
  constraint: |
    ・削除対象の予約が存在しない場合はエラーメッセージを表示  
    ・削除前にユーザー確認が必要  
    ・部屋の `IsReserved` を false に戻す処理も行う
