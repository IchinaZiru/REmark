id: F035
function: RoomManagementMenu
range:
- 643
- 689
args:
- RoomPtr *RoomList
return: void
requirement:
  trigger: "ユーザーが『Room Management Menu』を選択したとき"
  action: >
    画面にメニューを表示し、ユーザーの入力に応じて部屋管理に関する以下の機能を呼び出す：
      [1] 部屋の新規追加（AddNewRoomScreen）
      [2] 名前で検索（SearchRoomByNameScreen）
      [3] IDで検索（SearchRoomByIDScreen）
      [4] 部屋一覧の表示（DisplayRoomListScreen）
      [5] 削除（DeleteRoomScreen）
      [6] 空き確認（CheckRoomAvailabilityScreen）
      [7] メインメニューに戻る
  effect: "部屋情報に関する一連の管理操作をユーザーが選択式で実行できる"
  constraint: >
    有効な選択肢は 1〜7 に限定され、それ以外の入力には「Error!」と表示して再入力を求める。
    ループは選択肢が [7] のとき終了する。
