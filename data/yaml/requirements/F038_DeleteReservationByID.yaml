id: F038
function: DeleteReservationByID
range:
- 720
- 738
args:
- ReservationPtr ReservationList
- int ID
return: ReservationPtr
requirement:
  trigger: "指定したIDの予約を削除したいとき"
  action: "予約リストを探索し、該当するIDの予約ノードをリストから除去してメモリ解放する"
  effect: "対象の予約がリストから削除され、残りのリスト構造が維持される"
  constraint: "該当ノードが存在しない場合は何もしない。リストの先頭削除にも対応。対象ノードはfreeされる"